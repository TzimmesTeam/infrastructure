services:
  nats:
    image: ${NATS_IMAGE:-docker.io/library/nats:2.15.3-alpine}
    command: [--config, /etc/nats/nats.conf]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NATS_PORT:-4222}:4222"
      - "${BIND_ADDRESS:-127.0.0.1}:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null "http://127.0.0.1:8222/healthz?js-enabled-only=true"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

volumes:
  nats-data:
