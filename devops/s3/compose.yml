services:
  s3:
    image: ${S3_IMAGE:-docker.io/chrislusf/seaweedfs:4.54}
    command:
      - mini
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -s3.port=8333
      - -s3.port.iceberg=8181
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-zimmes-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-zimmes-local-s3-secret}
      S3_TABLE_BUCKET: ${S3_TABLE_BUCKET:-warehouse}
      WEED_ADMIN_PASSWORD: ${S3_ADMIN_PASSWORD:-}
      WEED_ADMIN_READONLY_USER: viewer
      WEED_ADMIN_READONLY_PASSWORD: ${S3_VIEWER_PASSWORD:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:8333"
      - "${BIND_ADDRESS:-127.0.0.1}:${ICEBERG_PORT:-8181}:8181"
      - "127.0.0.1:${S3_ADMIN_PORT:-12535}:12535"
    volumes:
      - s3-data:/data
    configs:
      - source: seaweedfs-notifications
        target: /etc/seaweedfs/notification.toml
    depends_on:
      event-bridge:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:8333/status &&
          curl -fsS --max-time 2 -o /dev/null
          "http://127.0.0.1:8181/v1/config?warehouse=$$S3_TABLE_BUCKET"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    restart: on-failure

  s3-init:
    image: ${AWS_CLI_IMAGE:-docker.io/amazon/aws-cli:2.40.4}
    entrypoint: [/bin/sh, /bootstrap/init.sh]
    environment:
      <<: &s3-cli-env
        AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-zimmes-local}
        AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-zimmes-local-s3-secret}
        AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
        AWS_EC2_METADATA_DISABLED: "true"
        AWS_PAGER: ""
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        S3_RAW_BUCKET: ${S3_RAW_BUCKET:-irrbb-raw-local}
      S3_CURATED_BUCKET: ${S3_CURATED_BUCKET:-irrbb-curated-local}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-irrbb-quarantine-local}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-irrbb-artifacts-local}
      S3_SCRATCH_BUCKET: ${S3_SCRATCH_BUCKET:-irrbb-scratch-local}
    volumes:
      - ./init.sh:/bootstrap/init.sh:ro
      - ./scratch-lifecycle.json:/bootstrap/scratch-lifecycle.json:ro
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  seed-cashflow-fixtures:
    profiles: [smoke]
    image: ${AWS_CLI_IMAGE:-docker.io/amazon/aws-cli:2.40.4}
    entrypoint: [/bin/sh, /fixtures/seed.sh]
    environment: *s3-cli-env
    volumes:
      - ../cashflow/seed.sh:/fixtures/seed.sh:ro
      - ../cashflow/fixtures/prep-deals.csv:/fixtures/deals.csv:ro
    depends_on:
      s3-init:
        condition: service_completed_successfully

volumes:
  s3-data:

configs:
  seaweedfs-notifications:
    content: |
      [notification.webhook]
      enabled = true
      endpoint = "http://event-bridge:8080/seaweedfs/events"
      event_types = ["create", "update"]
      path_prefixes = ["/buckets/${S3_RAW_BUCKET:-irrbb-raw-local}/source="]
